name: Materialize Briza CAD source

on:
  push:
    paths:
      - 'bootstrap/part-*'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source archive
        run: |
          mkdir -p /tmp/briza-source
          cat bootstrap/part-* | tr -d '\n\r' | base64 -d > /tmp/briza-source.zip
          echo "b5af6d422cfd7430f0b0f42615c3cb8d04ae50d7073b4bf6b319c54dfaf2b4ff  /tmp/briza-source.zip" | sha256sum -c -
          unzip -q /tmp/briza-source.zip -d /tmp/briza-source

      - name: Replace repository working tree
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/materialize-source.yml'             /tmp/briza-source/ ./
          rm -rf bootstrap

      - name: Commit project source
        run: |
          git config user.name "Briza CAD Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize Briza CAD 2.4.1 source"
          git push origin HEAD:main
