name: Materialize Briza CAD source

on:
  push:
    paths:
      - 'bootstrap/source.zip.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source archive
        run: |
          mkdir -p /tmp/briza-source
          base64 -d bootstrap/source.zip.b64 > /tmp/briza-source.zip
          unzip -q /tmp/briza-source.zip -d /tmp/briza-source

      - name: Replace repository working tree
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/materialize-source.yml'             /tmp/briza-source/ ./
          rm -rf bootstrap
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/materialize-source.yml" /tmp/materialize-source.yml 2>/dev/null || true

      - name: Commit project source
        run: |
          git config user.name "Briza CAD Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize Briza CAD 2.4.1 source"
          git push origin HEAD:main
